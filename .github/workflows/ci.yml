name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: contracts (compile + hardhat test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: contracts
        run: npm install
      - name: Compile
        working-directory: contracts
        run: npx hardhat compile
      - name: Test
        working-directory: contracts
        run: npx hardhat test

  relay-server:
    name: relay-server (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: relay-server
        run: npm install
      - name: Type-check + build
        working-directory: relay-server
        run: npm run build
      - name: Unit tests
        working-directory: relay-server
        run: npm test

  zk-circuits:
    name: zk-circuits (npm install sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: zk-circuits/package-lock.json
      - name: Install
        working-directory: zk-circuits
        run: npm install

  frontend-syntax:
    name: frontend (JS syntax check, no build step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check every frontend module
        run: |
          find frontend/js -name "*.js" -print0 | xargs -0 -n1 node --check

  ai-engine-syntax:
    name: ai-engine (Python syntax check, no model/deps required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check every module
        run: |
          python -m py_compile $(find ai-engine -name "*.py" -not -path "*/node_modules/*")
