services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-engine:
    build: ./ai-engine
    environment:
      ALLOW_RULE_BASED_FALLBACK: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      AI_ENGINE_URL: http://ai-engine:8000
    expose:
      - "5000"
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay-server:
    build: ./relay-server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random 32+ character AUTH_JWT_SECRET}
      RPC_URL: ${RPC_URL:?Set RPC_URL to a managed RPC endpoint}
      AI_API_URL: http://backend:5000/api/ai
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:?Set RELAYER_PRIVATE_KEY in the deployment environment}
      GOLDEN_LOCK_ADDRESS: ${GOLDEN_LOCK_ADDRESS:?Set the deployed GoldenLock address}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the dashboard origin}
      ALLOW_DEMO_PROOF: "false"
    expose:
      - "4000"
    volumes:
      - relay-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-dashboard:
    build:
      context: ./web-dashboard
      args:
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?Set the public relay URL}
        NEXT_PUBLIC_GOLDEN_LOCK_ADDRESS: ${GOLDEN_LOCK_ADDRESS:?Set the deployed GoldenLock address}
    ports:
      - "3000:3000"
    depends_on:
      relay-server:
        condition: service_healthy

volumes:
  relay-data:
  postgres-data:
  redis-data:
