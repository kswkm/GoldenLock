services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goldenlock
      POSTGRES_USER: goldenlock
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenlock -d goldenlock"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local-development-only"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-development-only", "ping"]
  ai-engine:
    build: ./ai-engine
    environment:
      DATABASE_URL: postgresql://goldenlock:local-development-only@postgres:5432/goldenlock
      REDIS_URL: redis://:local-development-only@redis:6379
      AUTH_JWT_SECRET: local-development-secret-change-this-value-123456789
      ALLOW_RULE_BASED_FALLBACK: ${ALLOW_RULE_BASED_FALLBACK:-true}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    environment:
      AI_ENGINE_URL: http://ai-engine:8000
    ports: ["5000:5000"]
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  blockchain:
    image: node:20-alpine
    working_dir: /app/contracts
    volumes: ["./:/app"]
    command: sh -c "npm install && npm run node"
    ports: ["8545:8545"]
  relay-server:
    build: ./relay-server
    environment:
      RPC_URL: http://blockchain:8545
      AI_API_URL: http://backend:5000/api/ai
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      GOLDEN_LOCK_ADDRESS: ${GOLDEN_LOCK_ADDRESS:-0x0000000000000000000000000000000000000000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOW_DEMO_PROOF: ${ALLOW_DEMO_PROOF:-false}
    ports: ["4000:4000"]
    volumes: ["relay-data:/app/data"]
    depends_on:
      backend:
        condition: service_healthy
      blockchain:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web-dashboard:
    build:
      context: ./web-dashboard
      args:
        NEXT_PUBLIC_RELAY_URL: http://localhost:4000
        NEXT_PUBLIC_GOLDEN_LOCK_ADDRESS: ${GOLDEN_LOCK_ADDRESS:-0x0000000000000000000000000000000000000000}
    environment:
      NEXT_PUBLIC_RELAY_URL: http://localhost:4000
      NEXT_PUBLIC_GOLDEN_LOCK_ADDRESS: ${GOLDEN_LOCK_ADDRESS:-0x0000000000000000000000000000000000000000}
    ports: ["3000:3000"]
    depends_on: [relay-server]

volumes:
  relay-data: